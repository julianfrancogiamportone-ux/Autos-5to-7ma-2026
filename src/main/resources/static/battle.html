<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pelea Épica: Batalla de Autos</title>
    <link rel="stylesheet" href="css/color.css">
</head>
<body>
    <h1>🔥 ¡Batalla de Autos! 🏎️</h1>

    <div id="fight-container">
        <div class="player">
            <h2>Jugador 1</h2>
            <img id="fighter1Image" src="placeholder1.png" alt="Jugador 1" class="fighter-img">
            <select id="fighter1"></select>
        </div>

        <div class="player">
            <h2>Jugador 2</h2>
            <img id="fighter2Image" src="placeholder2.png" alt="Jugador 2" class="fighter-img">
            <select id="fighter2"></select>
        </div>
    </div>

    <button id="fightButton">¡Pelear!</button>

    <div id="result" class="hidden"></div>

    <script src="/js/battle2.js"></script>
</body>
</html>
